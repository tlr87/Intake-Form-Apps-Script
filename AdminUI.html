<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/jsoneditor/9.10.2/jsoneditor.min.css" rel="stylesheet" type="text/css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jsoneditor/9.10.2/jsoneditor.min.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 20px; background: #f4f6f8; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    #jsoneditor { width: 100%; height: 520px; background: #fff; border-radius: 6px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
    .btn { background: #0056b3; color: white; border: 0; padding: 10px 18px; font-weight: bold; border-radius: 4px; cursor: pointer; }
    .btn:hover { background: #003d80; }
    #status { margin-top: 10px; font-weight: bold; }
    .success { color: #2e7d32; }
    .error { color: #c62828; }
  </style>
</head>
<body>
  <div class="header">
    <h2>RD3 Tech - Keyword Taxonomy Editor</h2>
    <button class="btn" onclick="saveData()">Save Taxonomy</button>
  </div>
  <div id="jsoneditor"></div>
  <div id="status">Loading configuration...</div>

  <script>
    const container = document.getElementById("jsoneditor");
    const editor = new JSONEditor(container, { mode: 'tree', modes: ['tree', 'form', 'code'] });

    google.script.run
      .withSuccessHandler(dataStr => {
        editor.set(JSON.parse(dataStr));
        editor.expandAll();
        document.getElementById('status').innerText = 'Ready';
      })
      .apiGetTaxonomy();

    function saveData() {
      const statusDiv = document.getElementById('status');
      statusDiv.className = '';
      statusDiv.innerText = 'Saving changes...';
      
      try {
        const jsonStr = JSON.stringify(editor.get());
        google.script.run
          .withSuccessHandler(res => {
            statusDiv.innerText = res.message;
            statusDiv.className = res.success ? 'success' : 'error';
          })
          .apiSaveTaxonomy(jsonStr);
      } catch (err) {
        statusDiv.innerText = 'JSON Error: ' + err.message;
        statusDiv.className = 'error';
      }
    }
  </script>
</body>
</html>
